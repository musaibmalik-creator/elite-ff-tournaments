/* =========================
   MESSAGE
========================= */

function showMessage(
  element,
  text,
  success = false
) {

  if (!element) return;

  element.textContent = text;

  element.classList.remove(
    "success",
    "error"
  );

  if (success) {

    element.classList.add(
      "success"
    );

  } else if (
    text.toLowerCase().includes("error") ||
    text.toLowerCase().includes("failed") ||
    text.toLowerCase().includes("invalid")
  ) {

    element.classList.add(
      "error"
    );

  }

}


/* =========================
   LOGIN
========================= */

loginButton.addEventListener(
  "click",
  login
);


document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        login();

      }

    }
  );


async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if (!email || !password) {

    showMessage(
      message,
      "Please enter email and password."
    );

    return;

  }


  loginButton.disabled = true;

  loginButton.textContent =
    "Logging in...";


  showMessage(
    message,
    "Logging in..."
  );


  try {

    const result =
      await supabase.auth
        .signInWithPassword({

          email: email,

          password: password

        });


    if (result.error) {

      showMessage(
        message,
        "Login Error: " +
        result.error.message
      );

      return;

    }


    if (
      result.data &&
      result.data.user
    ) {

      showDashboard(
        result.data.user
      );

      message.textContent = "";

    } else {

      showMessage(
        message,
        "Login failed."
      );

    }

  } catch (error) {

    showMessage(
      message,
      "Login Error: " +
      error.message
    );

  } finally {

    loginButton.disabled = false;

    loginButton.textContent =
      "Login";

  }

}

      error

      .from("tournaments")
      .insert({

        name:
          values.name,

        sport:

        description:
          values.description,

async function loadTournaments() {

  const list =
    document.getElementById(
      "tournamentList"
    );

  list.innerHTML =
    "Loading tournaments...";

  try {

    const { data, error } =
      await supabase
        .from("tournaments")
        .select("*")
        .order(
          "created_at",
          { ascending: false }
        );

    if (error) {

      list.innerHTML =
        `<p class="message error">
          Error: ${escapeHtml(
            error.message
          )}
        </p>`;

      return;
    }

    if (
      !data ||
      data.length === 0
    ) {

      list.innerHTML =
        `<p class="message">
          No tournaments created yet.
        </p>`;

      return;
    }

    list.innerHTML =
      data
        .map(
          tournament =>
            tournamentCard(tournament)
        )
        .join("");

  } catch (error) {

    list.innerHTML =
      `<p class="message error">
        Error: ${escapeHtml(
          error.message
        )}
      </p>`;

  }
}

/* =========================
   EDIT TOURNAMENT
========================= */

window.editTournament =
  async function(id) {

    try {

      const { data, error } =
        await supabase
          .from("tournaments")
          .select("*")
          .eq("id", id)
          .single();

      if (error) {

        showMessage(
          tournamentMessage,
          "Edit Error: " +
          error.message
        );

        return;
      }

      editingTournamentId = id;

      document.getElementById(
        "formTitle"
      ).textContent =
        "✏️ Edit Tournament";

      saveTournamentButton.textContent =
        "Update Tournament";

      cancelEditButton.classList.remove(
        "hidden"
      );

      document.getElementById(
        "tournamentName"
      ).value =
        data.name || "";

      document.getElementById(
        "tournamentSport"
      ).value =
        data.sport || "Free Fire";

      document.getElementById(
        "tournamentDescription"
      ).value =
        data.description || "";

      document.getElementById(
        "entryFee"
      ).value =
        data.entry_fee ?? 0;

      document.getElementById(
        "prizePool"
      ).value =
        data.prize_pool ?? 0;

      document.getElementById(
        "maxTeams"
      ).value =
        data.max_teams ?? 8;

      document.getElementById(
        "tournamentStatus"
      ).value =
        data.status ||
        "registration_open";

      if (data.starts_at) {

        const date =
          new Date(data.starts_at);

        const local =
          new Date(
            date.getTime() -
            date.getTimezoneOffset() *
            60000
          )
          .toISOString()
          .slice(0,16);

        document.getElementById(
          "startsAt"
        ).value = local;

      } else {

        document.getElementById(
          "startsAt"
        ).value = "";

      }

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    } catch (error) {

      showMessage(
        tournamentMessage,
        "Edit Error: " +
        error.message
      );

    }
  };/* =========================

/* =========================
   TOURNAMENT OPTIONS
========================= */

async function loadTournamentOptions() {

  playerTournament.innerHTML =
    `<option value="">
      Select Tournament
    </option>`;

  try {

    const { data, error } =
      await supabase
        .from("tournaments")
        .select("id,name")
        .order(
          "created_at",
          { ascending: false }
        );

    if (error) {

      console.error(
        "Tournament options error:",
        error
      );

      return;
    }

    if (!data) return;

    data.forEach(
      tournament => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          tournament.id;

        option.textContent =
          tournament.name;

        playerTournament.appendChild(
          option
        );

      }
    );

  } catch (error) {

    console.error(
      "Tournament options error:",
      error
    );

  }
}

window.editTournament = async function(id) {

  try {

    const { data, error } =
      await supabase
        .from("tournaments")

        .eq("id", id)
        .single();

    if (error) {

      showMessage(
        tournamentMessage,
        "Edit Error: " + error.message
      );

      return;
    }

    editingTournamentId = id;

    document.getElementById(
      "formTitle"
    ).textContent =
      "✏️ Edit Tournament";

    saveTournamentButton.textContent =
      "Update Tournament";

    cancelEditButton.classList.remove(
      "hidden"
    );

    document.getElementById(
      "tournamentName"
    ).value =
      data.name || "";

    document.getElementById(
      "tournamentSport"
    ).value =
      data.sport || "Free Fire";

    document.getElementById(
      "tournamentDescription"
    ).value =
      data.description || "";

    document.getElementById(
      "entryFee"
    ).value =
      data.entry_fee ?? 0;

    document.getElementById(
      "prizePool"
    ).value =
      data.prize_pool ?? 0;

    document.getElementById(
      "maxTeams"
    ).value =
      data.max_teams ?? 8;

    document.getElementById(
      "tournamentStatus"
    ).value =
      data.status || "registration_open";

    if (data.starts_at) {

      const date =
        new Date(data.starts_at);

      const local =
        new Date(
          date.getTime() -
          date.getTimezoneOffset() * 60000
        );

      document.getElementById(
        "startsAt"
      ).value =
        local.toISOString()
          .slice(0, 16);

    } else {

      document.getElementById(
        "startsAt"
      ).value = "";

    }

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  } catch (error) {

    showMessage(
      tournamentMessage,
      "Edit Error: " + error.message
    );

  }

        .from("players")
        .select("*", {

        });

    );

  }
