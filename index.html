function showMessage(element, text, success = false) {

  if (!element) return;

  element.textContent = text;

  element.classList.remove("success", "error");

  if (success) {
    element.classList.add("success");
  } else if (
    text.toLowerCase().includes("error") ||
    text.toLowerCase().includes("failed") ||
    text.toLowerCase().includes("invalid")
  ) {
    element.classList.add("error");
  }
}

async function login() {

  const emailElement = document.getElementById("email");
  const passwordElement = document.getElementById("password");

  if (!emailElement || !passwordElement) {
    console.error("Email or password element not found.");
    return;
  }

  const email = emailElement.value.trim();
  const password = passwordElement.value;

  if (!email || !password) {
    showMessage(
      message,
      "Please enter email and password."
    );
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "Logging in...";

  showMessage(
    message,
    "Logging in..."
  );

  try {

    const { data, error } =
      await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      showMessage(
        message,
        "Login Error: " + error.message
      );

      return;
    }

    if (data && data.user) {

      showDashboard(data.user);

      message.textContent = "";

    } else {

      showMessage(
        message,
        "Login failed. Please try again."
      );
    }

  } catch (error) {

    showMessage(
      message,
      "Login Error: " + error.message
    );

  } finally {

    loginButton.disabled = false;
    loginButton.textContent = "Login";
  }
}

function showDashboard(user) {

  const userEmail = document.getElementById("userEmail");

  if (userEmail) {

  }

  if (typeof loadTournamentCount === "function") {
    loadTournamentCount();
  }

  if (typeof loadPlayerCount === "function") {
    loadPlayerCount();
  }
}

async function editTournamentData(id) {

  try {

    const { data, error } =
      await supabase
        .from("tournaments")
        .select("*")
        .eq("id", id)
        .single();

    if (error) {

      showMessage(
        tournamentMessage,
        "Edit Error: " + error.message
      );

      return;

    }

    editingTournamentId = id;

    const formTitle =
      document.getElementById("formTitle");

    if (formTitle) {
      formTitle.textContent =
        "✏️ Edit Tournament";
    }

    if (saveTournamentButton) {
      saveTournamentButton.textContent =
        "Update Tournament";
    }

    if (cancelEditButton) {
      cancelEditButton.classList.remove(
        "hidden"
      );
    }

    document.getElementById(
      "tournamentName"
    ).value =
      data.name || "";

    document.getElementById(
      "tournamentSport"
    ).value =
      data.sport || "Free Fire";

    document.getElementById(
      "tournamentDescription"
    ).value =
      data.description || "";

    document.getElementById(
      "entryFee"
    ).value =
      data.entry_fee ?? 0;

    document.getElementById(
      "prizePool"
    ).value =
      data.prize_pool ?? 0;

    document.getElementById(
      "maxTeams"
    ).value =
      data.max_teams ?? 8;

    document.getElementById(
      "tournamentStatus"
    ).value =
      data.status ||
      "registration_open";

    document.getElementById(
      "startsAt"
    ).value =
      data.starts_at
        ? new Date(
            data.starts_at
          )
            .toISOString()
            .slice(0, 16)
        : "";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  } catch (error) {

    showMessage(
      tournamentMessage,
      "Edit Error: " +
      error.message
    );

  }

}

async function loadTournamentOptions() {

  playerTournament.innerHTML =
    `<option value="">
      Select Tournament
    </option>`;

  try {

    const { data, error } =
      await supabase
        .from("tournaments")
        .select("id,name")
        .order(
          "created_at",
          {
            ascending: false
          }
        );

    if (error) {

      console.error(
        "Tournament options error:",
        error
      );

      return;

    }

    if (!data)
      return;

    data.forEach(
      tournament => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          tournament.id;

        option.textContent =
          tournament.name;

        playerTournament.appendChild(
          option

}

/* =========================
   LOAD PLAYERS
========================= */

async function loadPlayers() {

  if (!playerList)
    return;

  playerList.innerHTML =
    "Loading players...";

  try {

    const { data, error } =
      await supabase
        .from("players")
        .select(`
          *,
          tournaments (
            name
          )
        `)
        .order(
          "created_at",
          {
            ascending: false
          }
        );

    if (error) {

      playerList.innerHTML =
        `<p class="message error">
          Error: ${escapeHtml(
            error.message
          )}
        </p>`;

      return;

    }

    if (
      !data ||
      data.length === 0
    ) {

      playerList.innerHTML =
        `<p class="message">
          No players registered yet.
        </p>`;

      return;

    }

    playerList.innerHTML =
      data
        .map(
          player =>
            playerCard(player)
        )
        .join("");

  } catch (error) {

    playerList.innerHTML =
      `<p class="message error">
        Error: ${escapeHtml(
          error.message
        )}
      </p>`;

  }

}


/* =========================
   PLAYER CARD
========================= */

function playerCard(player) {

  const tournamentName =
    player.tournaments &&
    player.tournaments.name
      ? player.tournaments.name
      : "No tournament";

  return `

    <div class="tournament-card">

      <span class="badge">
        👤 Player
      </span>

      <h3>
        🎮 ${escapeHtml(
          player.name ||
          "Unnamed Player"
        )}
      </h3>

      <div class="tournament-info">

        <div>
          🆔 UID:
          ${escapeHtml(
            player.uid || ""
          )}
        </div>

        <div>
          👥 Team:
          ${escapeHtml(
            player.team_name ||
            "No team"
          )}
        </div>

        <div>
          🏆 Tournament:
          ${escapeHtml(
            tournamentName
          )}
        </div>

        <div>
          📅 Added:
          ${escapeHtml(
            player.created_at
              ? new Date(
                  player.created_at
                ).toLocaleString()
              : "Unknown"
          )}
        </div>

      </div>

      <button
        class="menu-button"
        onclick="editPlayer('${escapeHtml(
          player.id
        )}')"
      >
        ✏️ Edit
      </button>

      <button
        class="danger"
        onclick="deletePlayer('${escapeHtml(
          player.id
        )}')"
      >
        🗑️ Delete
      </button>

    </div>

  `;

}

/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}
