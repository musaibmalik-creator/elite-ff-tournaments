<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Elite FF Tournaments</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%,rgba(255,193,7,.14),transparent 42%),linear-gradient(180deg,#111 0%,#070707 100%);color:#fff;padding:20px}
    .card{width:100%;max-width:420px;background:linear-gradient(145deg,#171717,#0d0d0d);padding:28px;border:1px solid rgba(255,193,7,.3);border-radius:22px;box-shadow:0 18px 48px rgba(0,0,0,.48),0 0 28px rgba(255,193,7,.07)}
    h1{text-align:center;margin-bottom:8px;color:#ffc107;letter-spacing:.4px}
    .subtitle{text-align:center;color:#aaa;margin-bottom:25px}
    label{display:block;margin-bottom:7px;font-size:14px;color:#ddd}
    input{width:100%;padding:13px;margin-bottom:17px;border:1px solid #393939;border-radius:11px;background:#151515;color:white;outline:none;font-size:15px}
    input:focus{border-color:#ffc107;box-shadow:0 0 0 3px rgba(255,193,7,.1)}
    button{width:100%;padding:14px;border:0;border-radius:11px;background:linear-gradient(135deg,#ffda55,#ffc107 55%,#e5a900);color:#111;font-size:16px;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .message{margin-top:15px;text-align:center;font-size:14px;line-height:1.5;color:#ffc107;overflow-wrap:anywhere}
    .back{display:block;text-align:center;margin-top:20px;color:#ffc107;text-decoration:none;font-size:14px}
    .hidden{display:none}
    .hint{font-size:12px;color:#aaa;margin-top:-10px;margin-bottom:16px;line-height:1.4}
  </style>
</head>
<body>
  <div class="card">
    <h1>Create Account</h1>
    <p class="subtitle">Join Elite FF Tournaments</p>

    <form id="signupForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Create a password" minlength="6" autocomplete="new-password" required>

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm your password" minlength="6" autocomplete="new-password" required>

      <button type="submit" id="signupBtn">Create Account</button>
    </form>

    <div id="message" class="message" role="status" aria-live="polite"></div>
    <a href="user.html" class="back">← Back to Login</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://yenhkcditizmcekjeswy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_W5nO87IBUz1ic5Z0G1ZVPw_3KY8U1qD";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const signupForm = document.getElementById("signupForm");
    const signupBtn = document.getElementById("signupBtn");
    const message = document.getElementById("message");

    signupForm.addEventListener("submit", async function(e) {
      e.preventDefault();
      message.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }
      if (password.length < 6) {
        message.textContent = "Password must be at least 6 characters.";
        return;
      }

      signupBtn.disabled = true;
      signupBtn.textContent = "Creating Account...";
      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password
        });
        if (error) throw error;
        if (!data.user) throw new Error("Account create nahi ho saka. Please try again.");
        if (!data.session) {
          message.textContent = "Account created. Please check your email to confirm your account, then log in.";
          signupBtn.disabled = false;
          signupBtn.textContent = "Create Account";
          return;
        }

        message.textContent = "Account created successfully! Redirecting to login...";
        setTimeout(() => {
          window.location.href = "user.html";
        }, 1200);
      } catch (error) {
        message.textContent = "Error: " + error.message;
        signupBtn.disabled = false;
        signupBtn.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
