<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Elite FF Tournaments</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f19;
      color: white;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #151b2b;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      border: 1px solid #30384d;
      border-radius: 10px;
      background: #0d1320;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #4f8cff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #4f8cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #8ab4ff;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Create Account</h1>

    <p class="subtitle">
      Join Elite FF Tournaments
    </p>

    <form id="signupForm">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="6"
        required
      >

      <button type="submit" id="signupBtn">
        Create Account
      </button>

    </form>

    <div id="message" class="message"></div>

    <a href="user.html" class="back">
      ← Back to Login
    </a>

  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
    "https://yenhkcditizmcekjeswy.supabase.co";
    
    const SUPABASE_KEY =
    "sb_publishable_W5nO87IBUz1ic5Z0G1ZVPw_3KY8U1qD";

    const { createClient } = supabase;

    const supabaseClient = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

    const form = document.getElementById("signupForm");
    const signupBtn = document.getElementById("signupBtn");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(e) {

      e.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      message.textContent = "";

      if (password !== confirmPassword) {

        message.textContent = "Passwords do not match.";
        return;

      }

      if (password.length < 6) {

        message.textContent =
          "Password must be at least 6 characters.";

        return;
      }

      signupBtn.disabled = true;
      signupBtn.textContent = "Creating Account...";

      try {

        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password
          });

        if (error) {
          throw error;
        }

        if (data.user) {

          message.textContent =
            "Account created successfully!";

          setTimeout(() => {
            window.location.href = "user.html";
          }, 1500);

        }

      } catch (error) {

        message.textContent =
          "Error: " + error.message;

        signupBtn.disabled = false;
        signupBtn.textContent = "Create Account";
      }

    });

  </script>

</body>
</html>
