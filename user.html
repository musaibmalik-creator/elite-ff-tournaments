<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Elite FF Tournaments</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #fff;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 16px;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    .card {
      background: #151c31;
      border: 1px solid #27304b;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #34405f;
      font-size: 15px;
    }

    input {
      background: #0e1528;
      color: #fff;
      outline: none;
    }

    button {
      background: #2563eb;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #27304b;
    }

    button.danger {
      background: #dc2626;
    }

    button.success {
      background: #16a34a;
    }

    button:disabled {
      opacity: .6;
    }

    .hidden {
      display: none !important;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .top button {
      width: auto;
      margin-top: 0;
    }

    .balance {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }

    .muted {
      color: #9ca3af;
      font-size: 13px;
    }

    .tournament {
      background: #10172b;
      border: 1px solid #2d3857;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 7px 0;
    }

    .row span:last-child {
      font-weight: bold;
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: #111827;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- LOGIN / REGISTER -->

  <div id="loginSection">

    <div class="card">

      <h1>🎮 Elite FF Tournaments</h1>

      <p class="muted">
        Login or create your account
      </p>

      <input
        id="email"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        id="loginButton"
        type="button"
      >
        Login
      </button>

      <button
        id="signupButton"
        class="secondary"
        type="button"
      >
        Create Account
      </button>

      <div
        id="authMessage"
        class="message"
      ></div>

    </div>

  </div>


  <!-- HOME -->

  <div
    id="homeSection"
    class="hidden"
  >

    <div class="card">

      <div class="top">

        <div>

          <h2>👤 My Account</h2>

          <div
            id="userEmail"
            class="muted"
          ></div>

        </div>

        <button
          id="logoutButton"
          class="secondary"
          type="button"
        >
          Logout
        </button>

      </div>

      <p>Wallet Balance</p>

      <div
        id="walletBalance"
        class="balance"
      >
        ₹0.00
      </div>

    </div>


    <!-- MENU -->

    <div class="card">

      <button
        id="openTournamentsButton"
        type="button"
      >
        🏆 Tournaments
      </button>

      <button
        id="openDepositButton"
        type="button"
      >
        💰 Deposit
      </button>

      <button
        id="openWithdrawButton"
        type="button"
      >
        💸 Withdraw
      </button>

      <button
        id="openMyTournamentsButton"
        type="button"
      >
        🎮 My Tournaments
      </button>

    </div>


    <!-- TOURNAMENTS -->

    <div
      id="tournamentsSection"
      class="card hidden"
    >

      <div class="top">

        <h2>🏆 Tournaments</h2>

        <button
          id="backTournamentButton"
          class="secondary"
          type="button"
        >
          Back
        </button>

      </div>

      <div id="tournamentList">
        Loading tournaments...
      </div>

    </div>


    <!-- TEAM -->

    <div
      id="teamSection"
      class="card hidden"
    >

      <div class="top">

        <h2>👥 Register Team</h2>

        <button
          id="backTeamButton"
          class="secondary"
          type="button"
        >
          Back
        </button>

      </div>

      <div id="teamTournamentInfo"></div>

      <input
        id="teamName"
        type="text"
        placeholder="Team Name"
      >

      <h3>Player 1</h3>

      <input
        id="player1Name"
        type="text"
        placeholder="Player Name"
      >

      <input
        id="player1UID"
        type="text"
        placeholder="Free Fire UID"
      >

      <h3>Player 2</h3>

      <input
        id="player2Name"
        type="text"
        placeholder="Player Name"
      >

      <input
        id="player2UID"
        type="text"
        placeholder="Free Fire UID"
      >

      <h3>Player 3</h3>

      <input
        id="player3Name"
        type="text"
        placeholder="Player Name"
      >

      <input
        id="player3UID"
        type="text"
        placeholder="Free Fire UID"
      >

      <h3>Player 4</h3>

      <input
        id="player4Name"
        type="text"
        placeholder="Player Name"
      >

      <input
        id="player4UID"
        type="text"
        placeholder="Free Fire UID"
      >

      <button
        id="registerTeamButton"
        class="success"
        type="button"
      >
        Register Team & Join
      </button>

      <div
        id="teamMessage"
        class="message"
      ></div>

    </div>


    <!-- DEPOSIT -->

    <div
      id="depositSection"
      class="card hidden"
    >

      <div class="top">

        <h2>💰 Deposit</h2>

        <button
          id="backDepositButton"
          class="secondary"
          type="button"
        >
          Back
        </button>

      </div>

      <p class="muted">
        Enter amount and UTR / Transaction ID.
      </p>

      <input
        id="depositAmount"
        type="number"
        min="1"
        placeholder="Amount"
      >

      <input
        id="depositUTR"
        type="text"
        placeholder="UTR / Transaction ID"
      >

      <button
        id="submitDepositButton"
        type="button"
      >
        Submit Deposit
      </button>

      <div
        id="depositMessage"
        class="message"
      ></div>

    </div>


    <!-- WITHDRAW -->

    <div
      id="withdrawSection"
      class="card hidden"
    >

      <div class="top">

        <h2>💸 Withdraw</h2>

        <button
          id="backWithdrawButton"
          class="secondary"
          type="button"
        >
          Back
        </button>

      </div>

      <input
        id="withdrawAmount"
        type="number"
        min="1"
        placeholder="Amount"
      >

      <input
        id="withdrawUPI"
        type="text"
        placeholder="UPI ID / Bank Details"
      >

      <button
        id="submitWithdrawButton"
        type="button"
      >
        Submit Withdrawal
      </button>

      <div
        id="withdrawMessage"
        class="message"
      ></div>

    </div>


    <!-- MY TOURNAMENTS -->

    <div
      id="myTournamentsSection"
      class="card hidden"
    >

      <div class="top">

        <h2>🎮 My Tournaments</h2>

        <button
          id="backMyTournamentButton"
          class="secondary"
          type="button"
        >
          Back
        </button>

      </div>

      <div id="myTournamentList">
        Loading...
      </div>

    </div>

  </div>

</div>


<script>

"use strict";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://yenhkcditizmcekjeswy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_W5nO87IBUz1ic5Z0G1ZVPw_3KY8U1qD";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   HELPERS
========================================= */

const $ = function(id) {

  return document.getElementById(id);

};


let currentUser = null;

let selectedTournament = null;


function money(value) {

  return "₹" +
    Number(value || 0).toFixed(2);

}


function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function showMessage(
  elementId,
  text
) {

  const element =
    $(elementId);

  if (element) {

    element.textContent =
      text || "";

  }

}


function showOnly(sectionId) {

  const sections = [

    "tournamentsSection",

    "teamSection",

    "depositSection",

    "withdrawSection",

    "myTournamentsSection"

  ];

  sections.forEach(function(id) {

    $(id)
      .classList
      .add("hidden");

  });


  if (sectionId) {

    $(sectionId)
      .classList
      .remove("hidden");

  }

}


/* =========================================
   WALLET
========================================= */

async function ensureWallet() {

  if (!currentUser) {

    return;

  }


  const { data, error } =
    await supabaseClient
      .from("wallets")
      .select("user_id")
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();


  if (error) {

    console.error(
      "Wallet check:",
      error
    );

    return;

  }


  if (!data) {

    const { error: insertError } =
      await supabaseClient
        .from("wallets")
        .insert({

          user_id:
            currentUser.id,

          balance: 0

        });


    if (insertError) {

      console.error(
        "Wallet create:",
        insertError
      );

    }

  }

}


async function loadWallet() {

  if (!currentUser) {

    return;

  }


  const { data, error } =
    await supabaseClient
      .from("wallets")
      .select("balance")
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();


  if (error) {

    console.error(
      "Wallet load:",
      error
    );

    $("walletBalance")
      .textContent = "₹0.00";

    return;

  }


  $("walletBalance")
    .textContent =
      money(
        data?.balance || 0
      );

}


/* =========================================
   START APP
========================================= */

async function startApp() {

  const { data, error } =
    await supabaseClient.auth.getUser();


  if (error) {

    console.error(
      "Get user error:",
      error
    );

    return;

  }


  currentUser =
    data?.user || null;


  if (!currentUser) {

    $("loginSection")
      .classList
      .remove("hidden");

    $("homeSection")
      .classList
      .add("hidden");

    return;

  }


  $("loginSection")
    .classList
    .add("hidden");


  $("homeSection")
    .classList
    .remove("hidden");


  $("userEmail")
    .textContent =
      currentUser.email || "";


  await ensureWallet();

  await loadWallet();

}


/* =========================================
   LOGIN
========================================= */

$("loginButton")
  .addEventListener(
    "click",
    async function() {

      const email =
        $("email")
          .value
          .trim();


      const password =
        $("password")
          .value;


      if (!email || !password) {

        showMessage(
          "authMessage",
          "Enter email and password."
        );

        return;

      }


      showMessage(
        "authMessage",
        "Logging in..."
      );


      const { error } =
        await supabaseClient.auth
          .signInWithPassword({

            email:
              email,

            password:
              password

          });


      if (error) {

        showMessage(
          "authMessage",
          error.message
        );

        return;

      }


      showMessage(
        "authMessage",
        "Login successful."
      );


      await startApp();

    }
  );


/* =========================================
   SIGN UP
========================================= */

$("signupButton")
  .addEventListener(
    "click",
    async function() {

      const email =
        $("email")
          .value
          .trim();


      const password =
        $("password")
          .value;


      if (!email || !password) {

        showMessage(
          "authMessage",
          "Enter email and password."
        );

        return;

      }


      if (password.length < 6) {

        showMessage(
          "authMessage",
          "Password must be at least 6 characters."
        );

        return;

      }


      showMessage(
        "authMessage",
        "Creating account..."
      );


      const { data, error } =
        await supabaseClient.auth
          .signUp({

            email:
              email,

            password:
              password

          });


      if (error) {

        showMessage(
          "authMessage",
          error.message
        );

        return;

      }


      if (data?.session) {

        await startApp();

        return;

      }


      showMessage(
        "authMessage",
        "Account created. Please verify your email if required, then login."
      );

    }
  );


/* =========================================
   TOURNAMENTS
========================================= */

async function loadTournaments() {

  $("tournamentList")
    .innerHTML =
      "⏳ Loading tournaments...";


  const { data, error } =
    await supabaseClient
      .from("tournaments")
      .select("*")
      .order(
        "starts_at",
        {
          ascending: true
        }
      );


  if (error) {

    $("tournamentList")
      .innerHTML =
        "❌ Error: " +
        escapeHtml(
          error.message
        );

    return;

  }


  if (!data || data.length === 0) {

    $("tournamentList")
      .innerHTML =
        "No tournaments available.";

    return;

  }


  $("tournamentList")
    .innerHTML =
      data.map(function(t) {

        return `

          <div class="tournament">

            <h3>
              🏆 ${escapeHtml(
                t.name || "Tournament"
              )}
            </h3>

            <div class="row">
              <span>Sport</span>
              <span>
                ${escapeHtml(
                  t.sport || "-"
                )}
              </span>
            </div>

            <div class="row">
              <span>Entry Fee</span>
              <span class="price">
                ${money(
                  t.entry_fee
                )}
              </span>
            </div>

            <div class="row">
              <span>Prize Pool</span>
              <span>
                ${money(
                  t.prize_pool
                )}
              </span>
            </div>

            <div class="row">
              <span>Max Teams</span>
              <span>
                ${escapeHtml(
                  t.max_teams || "-"
                )}
              </span>
            </div>

            <div class="row">
              <span>Status</span>
              <span>
                ${escapeHtml(
                  t.status || "-"
                )}
              </span>
            </div>

            <button
              type="button"
              class="joinButton"
              data-id="${escapeHtml(
                t.id
              )}"
            >
              Register Team
            </button>

          </div>

        `;

      }).join("");


  document
    .querySelectorAll(".joinButton")
    .forEach(function(button) {

      button.addEventListener(
        "click",
        function() {

          openTeamRegistration(
            button.dataset.id
          );

        }
      );

    });

}


/* =========================================
   TEAM REGISTRATION OPEN
========================================= */

async function openTeamRegistration(
  tournamentId
) {

  const { data, error } =
    await supabaseClient
      .from("tournaments")
      .select("*")
      .eq(
        "id",
        tournamentId
      )
      .single();


  if (error) {

    alert(
      error.message
    );

    return;

  }


  selectedTournament =
    data;


  $("teamTournamentInfo")
    .innerHTML = `

      <div class="tournament">

        <h3>
          🏆 ${escapeHtml(
            data.name
          )}
        </h3>

        <div class="row">
          <span>Entry Fee</span>
          <span>
            ${money(
              data.entry_fee
            )}
          </span>
        </div>

        <div class="row">
          <span>Prize Pool</span>
          <span>
            ${money(
              data.prize_pool
            )}
          </span>
        </div>

      </div>

    `;


  showOnly(
    "teamSection"
  );

}


/* =========================================
   REGISTER TEAM
========================================= */

$("registerTeamButton")
  .addEventListener(
    "click",
    async function() {

      if (!currentUser) {

        showMessage(
          "teamMessage",
          "Please login first."
        );

        return;

      }


      if (!selectedTournament) {

        showMessage(
          "teamMessage",
          "Tournament not selected."
        );

        return;

      }


      const teamName =
        $("teamName")
          .value
          .trim();


      if (!teamName) {

        showMessage(
          "teamMessage",
          "Enter team name."
        );

        return;

      }


      const players = [];


      for (
        let i = 1;
        i <= 4;
        i++
      ) {

        const name =
          $(
            "player" +
            i +
            "Name"
          )
            .value
            .trim();


        const uid =
          $(
            "player" +
            i +
            "UID"
          )
            .value
            .trim();


        if (!name || !uid) {

          showMessage(
            "teamMessage",
            "Please fill all 4 players."
          );

          return;

        }


        players.push({
          name: name,
          uid: uid
        });

      }


      showMessage(
        "teamMessage",
        "⏳ Checking wallet..."
      );


      const { data: wallet, error: walletError } =
        await supabaseClient
          .from("wallets")
          .select("balance")
          .eq(
            "user_id",
            currentUser.id
          )
          .maybeSingle();


      if (walletError) {

        showMessage(
          "teamMessage",
          "Wallet Error: " +
          walletError.message
        );

        return;

      }


      const balance =
        Number(
          wallet?.balance || 0
        );


      const entryFee =
        Number(
          selectedTournament.entry_fee || 0
        );


      if (balance < entryFee) {

        showMessage(
          "teamMessage",
          "❌ Insufficient wallet balance."
        );

        return;

      }


      const { data: existing } =
        await supabaseClient
          .from("registrations")
          .select("id")
          .eq(
            "tournament_id",
            selectedTournament.id
          )
          .eq(
            "user_id",
            currentUser.id
          )
          .maybeSingle();


        if (existing) {

    showMessage(
      "teamMessage",
      "You already registered for this tournament."
    );

    return;

  }


  /* =========================================
     CREATE TEAM
  ========================================= */

  const { data: team, error: teamError } =
    await supabaseClient
      .from("teams")
      .insert({
        tournament_id:
          selectedTournament.id,

        captain_id:
          currentUser.id,

        name:
          teamName
      })
      .select()
      .single();


  if (teamError) {

    showMessage(
      "teamMessage",
      "Team Error: " +
      teamError.message
    );

    return;

  }


  /* =========================================
     CREATE REGISTRATION
  ========================================= */

  const {
    data: registration,
    error: registrationError
  } =
    await supabaseClient
      .from("registrations")
      .insert({

        tournament_id:
          selectedTournament.id,

        team_id:
          team.id,

        user_id:
          currentUser.id,

        status:
          "confirmed"

      })
      .select()
      .single();


  if (registrationError) {

    showMessage(
      "teamMessage",
      "Registration Error: " +
      registrationError.message
    );

    return;

  }


  /* =========================================
     ADD PLAYERS
  ========================================= */

  const playerRows =
    players.map(function(player) {

      return {

        team_id:
          team.id,

        name:
          player.name,

        team_name:
          teamName,

        tournament_id:
          selectedTournament.id,

        uid:
          player.uid,

        status:
          "approved"

      };

    });


  const {
    error: playersError
  } =
    await supabaseClient
      .from("players")
      .insert(
        playerRows
      );


  if (playersError) {

    showMessage(
      "teamMessage",
      "Players Error: " +
      playersError.message
    );

    return;

  }


  /* =========================================
     PAYMENT RECORD
  ========================================= */

  const {
    error: paymentError
  } =
    await supabaseClient
      .from("payments")
      .insert({

        user_id:
          currentUser.id,

        tournament_id:
          selectedTournament.id,

        registration_id:
          registration.id,

        amount:
          entryFee,

        status:
          "completed"

      });


  if (paymentError) {

    console.error(
      "Payment record error:",
      paymentError
    );

  }


  /* =========================================
     DEDUCT WALLET
  ========================================= */

  const newBalance =
    balance - entryFee;


  const {
    error: balanceError
  } =
    await supabaseClient
      .from("wallets")
      .update({

        balance:
          newBalance

      })
      .eq(
        "user_id",
        currentUser.id
      );


  if (balanceError) {

    showMessage(
      "teamMessage",
      "Wallet Update Error: " +
      balanceError.message
    );

    return;

  }


  await loadWallet();


  showMessage(
    "teamMessage",
    "✅ Team registered successfully!"
  );


  setTimeout(
    function() {

      showOnly(null);

    },
    1500
  );
      }


/* =========================================
   DEPOSIT
========================================= */

$("openDepositButton")
  .addEventListener(
    "click",
    function() {

      showOnly(
        "depositSection"
      );

      showMessage(
        "depositMessage",
        ""
      );

    }
  );


$("backDepositButton")
  .addEventListener(
    "click",
    function() {

      showOnly(null);

    }
  );


$("submitDepositButton")
  .addEventListener(
    "click",
    async function() {

      if (!currentUser) {

        showMessage(
          "depositMessage",
          "Please login first."
        );

        return;

      }


      const amount =
        Number(
          $("depositAmount").value
        );


      const utr =
        $("depositUTR")
          .value
          .trim();


      if (!amount || amount <= 0) {

        showMessage(
          "depositMessage",
          "Enter a valid amount."
        );

        return;

      }


      if (!utr) {

        showMessage(
          "depositMessage",
          "Enter UTR / Transaction ID."
        );

        return;

      }


      showMessage(
        "depositMessage",
        "⏳ Submitting deposit..."
      );


      const {
        error
      } =
        await supabaseClient
          .from("deposits")
          .insert({

            user_id:
              currentUser.id,

            amount:
              amount,

            transaction_id:
              utr,

            status:
              "pending"

          });


      if (error) {

        showMessage(
          "depositMessage",
          "❌ Deposit Error: " +
          error.message
        );

        return;

      }


      $("depositAmount").value = "";

      $("depositUTR").value = "";


      showMessage(
        "depositMessage",
        "✅ Deposit request submitted. Admin will verify it."
      );

    }
  );

   WITHDRAW
========================================= */

$("openWithdrawButton")

    "click",

           showMessage(
        "withdrawMessage",
        ""
      );

$("backWithdrawButton")
  .addEventListener(
    "click",
    function() {

$("submitWithdrawButton")
  .addEventListener(
    "click",
    async function() {

      if (!currentUser) {

        showMessage(
          "withdrawMessage",
          "Please login first."
        );

        return;

      }

      const amount =
        Number(
          $("withdrawAmount").value
        );

      const details =
        $("withdrawUPI")
          .value
          .trim();

      if (!amount || amount <= 0) {

        showMessage(
          "withdrawMessage",
          "Enter a valid amount."
        );

        return;

      }

      if (!details) {

        showMessage(
          "withdrawMessage",
          "Enter UPI ID / Bank Details."
        );

        return;

      }

      const {
        data: wallet,
        error: walletError
      } =
        await supabaseClient
          .from("wallets")
          .select("balance")
          .eq(
            "user_id",
            currentUser.id
          )
          .maybeSingle();

      if (walletError) {

        showMessage(
          "withdrawMessage",
          "Wallet Error: " +
          walletError.message
        );

        return;

      }

      const balance =
        Number(
          wallet?.balance || 0
        );

      if (balance < amount) {

        showMessage(
          "withdrawMessage",
          "❌ Insufficient wallet balance."
        );

        return;

      }

      showMessage(
        "withdrawMessage",
        "⏳ Submitting withdrawal..."
      );

      const {
        error
      } =
        await supabaseClient
          .from("withdrawals")
          .insert({

            user_id:
              currentUser.id,

            amount:
              amount,

            payment_details:
              details,

            status:
              "pending"

          });

      if (error) {

        showMessage(
          "withdrawMessage",
          "❌ Withdrawal Error: " +
          error.message
        );

        return;

      }

      $("withdrawAmount").value = "";
      $("withdrawUPI").value = "";

      showMessage(
        "withdrawMessage",
        "✅ Withdrawal request submitted."
      );

    }
  );

/* =========================================
   LOAD MY TOURNAMENTS
========================================= */

async function loadMyTournaments() {

  if (!currentUser) {

    $("myTournamentList").textContent =
      "Please login first.";

    return;

  }


  $("myTournamentList").textContent =
    "⏳ Loading your tournaments...";


  const { data, error } =
    await supabaseClient
      .from("registrations")
      .select(`
        id,
        tournament_id,
        team_id,
        user_id,
        status,
        created_at,
        tournaments (
          name,
          sport,
          entry_fee,
          prize_pool,
          starts_at
        ),
        teams (
          name
        )
      `)
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

        $("myTournamentList").textContent =
      "❌ Error: " +
      error.message;

    return;

  }


  if (!data || data.length === 0) {

    $("myTournamentList").textContent =
      "You haven't registered for any tournaments yet.";

    return;

  }


  $("myTournamentList").innerHTML =
    data.map(function(registration) {

      const tournament =
        registration.tournaments || {};

      const team =
        registration.teams || {};


      return `

        <div class="tournament">

          <h3>
            🏆 ${escapeHtml(
              tournament.name || "Tournament"
            )}
          </h3>

          <div class="row">
            <span>Sport</span>
            <span>
              ${escapeHtml(
                tournament.sport || "-"
              )}
            </span>
          </div>

          <div class="row">
            <span>Team</span>
            <span>
              ${escapeHtml(
                team.name || "-"
              )}
            </span>
          </div>

          <div class="row">
            <span>Entry Fee</span>
            <span>
              ${money(
                tournament.entry_fee
              )}
            </span>
          </div>

          <div class="row">
            <span>Prize Pool</span>
            <span>
              ${money(
                tournament.prize_pool
              )}
            </span>
          </div>

          <div class="row">
            <span>Status</span>
            <span>
              ${escapeHtml(
                registration.status || "-"
              )}
            </span>
          </div>

          <div class="row">
            <span>Registered</span>
            <span>
              ${registration.created_at
                ? new Date(
                    registration.created_at
                  ).toLocaleString()
                : "-"
              }
            </span>
          </div>

        </div>

      `;

    }).join("");

   TOURNAMENTS BUTTON
========================================= */

      location.reload();

    }

/* =========================================
   START APP
========================================= */

async function startApp() {

  const { data, error } =
    await supabaseClient.auth.getUser();

  if (error) {

    console.error(
      "User error:",
      error
    );

    return;

  }

  currentUser =
    data.user;

  if (!currentUser) {

    $("loginSection")
      .classList
      .remove("hidden");

    $("homeSection")
      .classList
      .add("hidden");

    return;

  }

  $("loginSection")
    .classList
    .add("hidden");

  $("homeSection")
    .classList
    .remove("hidden");

  $("userEmail")
    .textContent =
      currentUser.email || "";

  await ensureWallet();

  await loadWallet();

}


/* =========================================
   CHECK SESSION
========================================= */

const {
  data: sessionData
} =
  await supabaseClient.auth.getSession();


if (sessionData?.session) {

  await startApp();

} else {

  $("loginSection")
    .classList
    .remove("hidden");

  $("homeSection")
    .classList
    .add("hidden");

}
  </script>
