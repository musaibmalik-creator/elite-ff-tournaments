<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Elite FF Tournaments</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #fff;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 16px;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .card {
      background: #151c31;
      border: 1px solid #27304b;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #34405f;
      font-size: 15px;
    }

    input {
      background: #0e1528;
      color: #fff;
      outline: none;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #27304b;
    }

    button.danger {
      background: #dc2626;
    }

    button.success {
      background: #16a34a;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .top button {
      width: auto;
      margin-top: 0;
    }

    .balance {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }

    .muted {
      color: #9ca3af;
      font-size: 13px;
    }

    .tournament {
      background: #10172b;
      border: 1px solid #2d3857;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 7px 0;
    }

    .row span:last-child {
      font-weight: bold;
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: #111827;
      line-height: 1.5;
    }

    .team {
      background: #10172b;
      border: 1px solid #2d3857;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }

    .player {
      padding: 10px;
      margin-top: 8px;
      background: #172033;
      border-radius: 8px;
      border: 1px solid #34405f;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- LOGIN -->

      <h1>🎮 Elite FF Tournaments</h1>

      <p class="muted">

        type="email"

      <input
        id="password"

        placeholder="Password"

      <button id="loginButton" type="button">

      <button

        class="secondary"

        Create Account

      <div
        id="authMessage"

  </div>


  <!-- HOME -->

  <div
    id="homeSection"
    class="hidden"
  >

    <div class="card">

      <div class="top">

          <h2>👤 My Account</h2>

          <div

          ></div>

      </div>

      </div>

    <!-- MENU -->

      </button>

        type="button"

        💰 Deposit

      <button

    <!-- TOURNAMENTS -->

    <div

      <div class="top">

    <!-- TEAM REGISTRATION -->

      >

      <h3>Player 3</h3>

      <input
        id="player3Name"

      >

        id="player3UID"

      >

      <h3>Player 4</h3>

      <button

        Register Team & Join

    <!-- DEPOSIT -->

    <div

      <div class="top">

        <h2>💰 Deposit</h2>

        <button
          id="backDepositButton"

          type="button"
        >
          Back

      <p class="muted">
        Enter amount and UTR / Transaction ID.
      </p>

      <button

      ></div>

    </div>


    <!-- WITHDRAW -->

    <div
      id="withdrawSection"
      class="card hidden"
    >

      <div class="top">

        <h2>💸 Withdraw</h2>

        <button
          id="backWithdrawButton"
          class="secondary"
          type="button"
        >
          Back
        </button>

      </div>

      <input

        placeholder="Amount"
      >

      <input
        id="withdrawUPI"

      >

      <button
        id="submitWithdrawButton"

      >
        Submit Withdrawal

      <div

      ></div>

    </div>


    <!-- MY TOURNAMENTS -->

    <div
      id="myTournamentsSection"

    >

      <div class="top">

        <h2>🎮 My Tournaments</h2>

        <button
          id="backMyTournamentButton"
          class="secondary"

          Back

      <div id="myTournamentList">
        Loading...
      </div>

    </div>

  </div>

</div>


<script type="module">

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://yenhkcditizmcekjeswy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_W5nO87IBUz1ic5Z0G1ZVPw_3KY8U1qD";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   HELPERS
========================================= */

const $ =
  id => document.getElementById(id);

let currentUser = null;
let selectedTournament = null;


function money(value) {

  return "₹" +
    Number(value || 0)
      .toFixed(2);

}


function showMessage(id, text) {

  const element = $(id);

  if (element) {
    element.textContent = text;
  }

}


function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function showOnly(section) {

  const sections = [
    "tournamentsSection",
    "teamSection",
    "depositSection",
    "withdrawSection",
    "myTournamentsSection"
  ];

  sections.forEach(id => {

    $(id).classList.add("hidden");

  });

  if (section) {

    $(section)
      .classList
      .remove("hidden");

  }

}


/* =========================================
   WALLET
========================================= */

async function ensureWallet() {

  if (!currentUser) {
    return;
  }

  const { data, error } =
    await supabaseClient
      .from("wallets")
      .select("user_id")
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();

  if (error) {

    console.error(
      "Wallet check error:",
      error
    );

    return;

  }

  if (!data) {

    const { error: insertError } =
      await supabaseClient
        .from("wallets")
        .insert({

          user_id:
            currentUser.id,

          balance: 0

        });

    if (insertError) {

      console.error(
        "Wallet creation error:",
        insertError
      );

    }

  }

}


async function loadWallet() {

  if (!currentUser) {
    return;
  }

  const { data, error } =
    await supabaseClient
      .from("wallets")
      .select("balance")
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();

  if (error) {

    console.error(error);

    $("walletBalance")
      .textContent = "₹0.00";

    return;

  }

  $("walletBalance")
    .textContent =
      money(data?.balance || 0);

}


/* =========================================
   TOURNAMENTS
========================================= */

async function loadTournaments() {

  $("tournamentList")
    .innerHTML =
      "Loading tournaments...";

  const { data, error } =
    await supabaseClient
      .from("tournaments")
      .select("*")
      .order(
        "starts_at",
        {
          ascending: true
        }
      );

  if (error) {

    $("tournamentList")
      .innerHTML =
        "Error: " +
        error.message;

    return;

  }

  if (!data || data.length === 0) {

    $("tournamentList")
      .innerHTML =
        "No tournaments available.";

    return;

  }

  $("tournamentList")
    .innerHTML =
      data.map(t => `

        <div class="tournament">

          <h3>
            🏆 ${escapeHtml(t.name)}
          </h3>

          <div class="row">
            <span>Sport</span>
            <span>
              ${escapeHtml(
                t.sport || "Free Fire"
              )}
            </span>
          </div>

          <div class="row">
            <span>Entry Fee</span>
            <span class="price">
              ${money(t.entry_fee)}
            </span>
          </div>

          <div class="row">
            <span>Prize Pool</span>
            <span>
              ${money(t.prize_pool)}
            </span>
          </div>

          <div class="row">
            <span>Max Teams</span>
            <span>
              ${t.max_teams || "-"}
            </span>
          </div>

          <div class="row">
            <span>Status</span>
            <span>
              ${escapeHtml(
                t.status || "-"
              )}
            </span>
          </div>

          <button
            type="button"
            onclick="openTeamRegistration('${t.id}')"
          >
            Register Team
          </button>

        </div>

      `).join("");

}


/* =========================================
   OPEN TEAM REGISTRATION
========================================= */

window.openTeamRegistration =
  async function(tournamentId) {

    const { data, error } =
      await supabaseClient
        .from("tournaments")
        .select("*")
        .eq(
          "id",
          tournamentId
        )
        .single();

    if (error) {

      alert(error.message);

      return;

    }

    selectedTournament = data;

    $("teamTournamentInfo")
      .innerHTML = `

        <div class="tournament">

          <h3>
            🏆 ${escapeHtml(
              data.name
            )}
          </h3>

          <div class="row">
            <span>Entry Fee</span>
            <span>
              ${money(
                data.entry_fee
              )}
            </span>
          </div>

          <div class="row">
            <span>Prize Pool</span>
            <span>
              ${money(
                data.prize_pool
              )}
            </span>
          </div>

        </div>
      `;

    showOnly("teamSection");

  };


/* =========================================
   REGISTER TEAM
========================================= */

$("registerTeamButton")
  .addEventListener(
    "click",
    registerTeam
  );


async function registerTeam() {

  if (!currentUser) {

    showMessage(
      "teamMessage",
      "Please login first."
    );

    return;

  }

  if (!selectedTournament) {

    showMessage(
      "teamMessage",
      "Tournament not selected."
    );

    return;

  }


  const teamName =
    $("teamName")
      .value
      .trim();


  if (!teamName) {

    showMessage(
      "teamMessage",
      "Enter team name."
    );

    return;

  }


  const players = [

    {
      name:
        $("player1Name").value.trim(),

      uid:
        $("player1UID").value.trim()
    },

    {
      name:
        $("player2Name").value.trim(),

      uid:
        $("player2UID").value.trim()
    },

    {
      name:
        $("player3Name").value.trim(),

      uid:
        $("player3UID").value.trim()
    },

    {
      name:
        $("player4Name").value.trim(),

      uid:
        $("player4UID").value.trim()
    }

  ];


  for (
    let i = 0;
    i < players.length;
    i++
  ) {

    if (
      !players[i].name ||
      !players[i].uid
    ) {

      showMessage(
        "teamMessage",
        "Please fill all 4 players."
      );

      return;

    }

  }


  showMessage(
    "teamMessage",
    "⏳ Registering team..."
  );


  /* Check wallet */

  const { data: wallet, error: walletError } =
    await supabaseClient
      .from("wallets")
      .select("balance")
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();


  if (walletError) {

    showMessage(
      "teamMessage",
      "Wallet error: " +
      walletError.message
    );

    return;

  }


  const balance =
    Number(
      wallet?.balance || 0
    );


  const entryFee =
    Number(
      selectedTournament.entry_fee || 0
    );


  if (balance < entryFee) {

    showMessage(
      "teamMessage",
      "❌ Insufficient wallet balance. Please deposit first."
    );

    return;

  }


  /* Check existing registration */

  const { data: existingRegistration } =
    await supabaseClient
      .from("registrations")
      .select("id")
      .eq(
        "tournament_id",
        selectedTournament.id
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();


  if (existingRegistration) {

    showMessage(
      "teamMessage",
      "You already registered for this tournament."
    );

    return;

  }


  /* Create team */

  const { data: team, error: teamError } =
    await supabaseClient
      .from("teams")
      .insert({

        tournament_id:
          selectedTournament.id,

        captain_id:
          currentUser.id,

        name:
          teamName

      })
      .select()
      .single();


  if (teamError) {

    showMessage(
      "teamMessage",
      "Team Error: " +
      teamError.message
    );

    return;

  }


  /* Create registration */

  const { data: registration, error: registrationError } =
    await supabaseClient
      .from("registrations")
      .insert({

        tournament_id:
          selectedTournament.id,

        team_id:
          team.id,

        user_id:
          currentUser.id,

        status:
          "confirmed"

      })
      .select()
      .single();


  if (registrationError) {

    showMessage(
      "teamMessage",
      "Registration Error: " +
      registrationError.message
    );

    return;

  }


  /* Add players */

  const playerRows =
    players.map(player => ({

      team_id:
        team.id,

      name:
        player.name,

      team_name:
        teamName,

      tournament_id:
        selectedTournament.id,

      uid:
        player.uid,

      status:
        "approved"

    }));


  const { error: playersError } =
    await supabaseClient
      .from("players")
      .insert(playerRows);


  if (playersError) {

    showMessage(
      "teamMessage",
      "Players Error: " +
      playersError.message
    );

    return;

  }


  /* Create payment record */

  const { error: paymentError } =
    await supabaseClient
      .from("payments")
      .insert({

        user_id:
          currentUser.id,

        tournament_id:
          selectedTournament.id,

        registration_id:
          registration.id,

        amount:
          entryFee,

        currency:
          "INR",

        status:
          "completed"

      });


  if (paymentError) {

    console.error(
      "Payment record error:",
      paymentError
    );

  }


  /* Deduct wallet */

  const newBalance =
    balance - entryFee;


  const { error: balanceError } =
    await supabaseClient
      .from("wallets")
      .update({

        balance:
          newBalance

      })
      .eq(
        "user_id",
        currentUser.id
      );


  if (balanceError) {

    showMessage(
      "teamMessage",
      "Wallet update error: " +
      balanceError.message
    );

    return;

  }


  showMessage(
    "teamMessage",
    "✅ Team registered successfully!"
  );


  await loadWallet();


  setTimeout(
    function() {

      showOnly(null);

    },
    1500
  );

}


/* =========================================
   DEPOSIT
========================================= */

$("openDepositButton")
  .addEventListener(
    "click",
    function() {

      showOnly(
        "depositSection"
      );

    }
  );


$("backDepositButton")
  .addEventListener(
    "click",
    function() {

      showOnly(null);

    }
  );


$("submitDepositButton")
  .addEventListener(
    "click",
    submitDeposit
  );


async function submitDeposit() {

  const amount =
    Number(
      $("depositAmount")
        .value
    );

  const utr =
    $("depositUTR")
      .value
      .trim();


  if (
    !amount ||
    amount <= 0
  ) {

    showMessage(
      "depositMessage",
      "Enter a valid amount."
    );

    return;

  }


  if (!utr) {

    showMessage(
      "depositMessage",
      "Enter UTR / Transaction ID."
          return;

  }


  showMessage(
    "depositMessage",
    "⏳ Submitting deposit..."
  );


  if (!currentUser) {

    showMessage(
      "depositMessage",
      "Please login first."
    );

    return;

  }


  const { error } =
    await supabaseClient
      .from("deposits")
      .insert({

        user_id:
          currentUser.id,

        amount:
          amount,

        transaction_id:
          utr,

        status:
          "pending"

      });


  if (error) {

    showMessage(
      "depositMessage",
      "❌ Deposit Error: " +
      error.message
    );

    return;

  }


  showMessage(
    "depositMessage",
    "✅ Deposit submitted successfully. Admin will verify your UTR."
  );


  $("depositAmount").value = "";

  $("depositUTR").value = "";

}
   /* =========================================
   WITHDRAW
========================================= */

$("openWithdrawButton")
  .addEventListener(
    "click",
    function() {

      showOnly(
        "withdrawSection"
      );

    }
  );


$("backWithdrawButton")
  .addEventListener(
    "click",
    function() {

      showOnly(null);

    }
  );


$("submitWithdrawButton")
  .addEventListener(
    "click",
    submitWithdraw
  );


async function submitWithdraw() {

  const amount =
    Number(
      $("withdrawAmount")
        .value
    );

  const details =
    $("withdrawUPI")
      .value
      .trim();


  if (
    !amount ||
    amount <= 0
  ) {

    showMessage(
      "withdrawMessage",
      "Enter a valid amount."
    );

    return;

  }


  if (!details) {

    showMessage(
      "withdrawMessage",
      "Enter UPI ID / Bank Details."
    );

    return;

  }


  if (!currentUser) {

    showMessage(
      "withdrawMessage",
      "Please login first."
    );

    return;

  }


  showMessage(
    "withdrawMessage",
    "⏳ Checking wallet..."
  );


  const { data: wallet, error: walletError } =
    await supabaseClient
      .from("wallets")
      .select("balance")
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();


  if (walletError) {

    showMessage(
      "withdrawMessage",
      "❌ Wallet Error: " +
      walletError.message
    );

    return;

  }


  const balance =
    Number(
      wallet?.balance || 0
    );


  if (balance < amount) {

    showMessage(
      "withdrawMessage",
      "❌ Insufficient wallet balance."
    );

    return;

  }


  showMessage(
    "withdrawMessage",
    "⏳ Submitting withdrawal..."
  );


  const { error } =
    await supabaseClient
      .from("withdrawals")
      .insert({

        user_id:
          currentUser.id,

        amount:
          amount,

        payment_details:
          details,

        status:
          "pending"

      });


  if (error) {

    showMessage(
      "withdrawMessage",
      "❌ Withdrawal Error: " +
      error.message
    );

    return;

  }


  showMessage(
    "withdrawMessage",
    "✅ Withdrawal request submitted. Admin will process it."
  );


  $("withdrawAmount").value = "";

  $("withdrawUPI").value = "";

}
  /* =========================================
   SIGN UP
========================================= */

$("signupButton")
  .addEventListener(
    "click",
    async function() {

      const email =
        $("email")
          .value
          .trim();

      const password =
        $("password")
          .value;

      if (!email || !password) {

        $("authMessage").textContent =
          "Enter email and password.";

        return;

      }

      $("authMessage").textContent =
        "Creating account...";

      const { error } =
        await supabaseClient.auth
          .signUp({
            email: email,
            password: password
          });

      if (error) {

        $("authMessage").textContent =
          error.message;

        return;

      }

      $("authMessage").textContent =
        "Account created successfully. Please login.";

    }
  );
  /* =========================================
   MY TOURNAMENTS
========================================= */

$("openMyTournamentsButton")
  .addEventListener(
    "click",
    async function() {

      showOnly(
        "myTournamentsSection"
      );

      await loadMyTournaments();

    }
  );


$("backMyTournamentButton")
  .addEventListener(
    "click",
    function() {

      showOnly(null);

    }
  );


async function loadMyTournaments() {

  if (!currentUser) {

    showMessage(
      "myTournamentList",
      "Please login first."
    );

    return;

  }


  $("myTournamentList").innerHTML =
    "⏳ Loading your tournaments...";


  const { data, error } =
    await supabaseClient
      .from("registration")
      .select(`
        id,
        tournament_id,
        team_id,
        user_id,
        status,
        created_at,
        tournaments (
          name,
          sport,
          entry_fee,
          prize_pool,
          starts_at
        ),
        teams (
          name
        )
      `)
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    $("myTournamentList").innerHTML =
      "❌ Error: " +
      escapeHtml(error.message);

    return;

  }


  if (!data || data.length === 0) {

    $("myTournamentList").innerHTML =
      "You haven't registered for any tournament yet.";

    return;

  }


  $("myTournamentList").innerHTML =
    data.map(function(registration) {

      const tournament =
        registration.tournaments || {};

      const team =
        registration.teams || {};


      return `

        <div class="tournament">

          <h3>
            🏆
            ${escapeHtml(
              tournament.name ||
              "Tournament"
            )}
          </h3>

          <div class="row">
            <span>Sport</span>
            <span>
              ${escapeHtml(
                tournament.sport ||
                "-"
              )}
            </span>
          </div>

          <div class="row">
            <span>Team</span>
            <span>
              ${escapeHtml(
                team.name ||
                "-"
              )}
            </span>
          </div>

          <div class="row">
            <span>Entry Fee</span>
            <span>
              ${money(
                tournament.entry_fee
              )}
            </span>
          </div>

          <div class="row">
            <span>Prize Pool</span>
            <span>
              ${money(
                tournament.prize_pool
              )}
            </span>
          </div>

          <div class="row">
            <span>Status</span>
            <span>
              ${escapeHtml(
                registration.status ||
                "pending"
              )}
            </span>
          </div>

        </div>

      `;

    }).join("");

}
  /* =========================================
   LOGOUT
========================================= */

$("logoutButton")
  .addEventListener(
    "click",
    async function() {

      await supabaseClient.auth.signOut();

      currentUser = null;

      location.reload();

    }
  );


/* =========================================
   CHECK SESSION
========================================= */

const {
  data: sessionData
} = await supabaseClient.auth.getSession();

if (sessionData?.session) {
  await startApp();
}

</script>

</body>
</html>
